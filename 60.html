<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mom Snake 🐍🎂</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(160deg, #cfe8e3, #f6e6c9 60%, #f2cfe0);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #app {
    display: flex; flex-direction: column; align-items: center;
    height: 100%; padding: env(safe-area-inset-top,10px) 10px env(safe-area-inset-bottom,10px);
  }
  h1 {
    font-size: 1.4rem; margin: 6px 0 2px; color: #2f5d55; text-align: center;
  }
  #subtitle { font-size: 0.85rem; color: #6b6b6b; margin-bottom: 6px; text-align:center; }
  #scoreboard {
    display: flex; gap: 18px; margin-bottom: 6px; font-weight: 600; color: #2f5d55;
  }
  #canvasWrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #fffaf0;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    width: 100%;
    height: auto;
    touch-action: none;
    display: block;
  }
  #eatenWord {
    position: absolute;
    top: -6px; left: 50%; transform: translateX(-50%);
    font-size: 0.9rem; font-weight: 700; color: #d6376b;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.94);
    border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  #overlay h2 { color: #2f5d55; margin: 4px 0; font-size: 1.3rem; }
  #overlay p { color: #555; margin: 4px 0 14px; font-size: 0.95rem; max-width: 280px; }
  button.primary {
    background: #2f5d55; color: white; border: none; border-radius: 30px;
    padding: 14px 30px; font-size: 1.05rem; font-weight: 600;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  button.primary:active { transform: scale(0.96); }
  #controls {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 6px;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  #controls button {
    background: rgba(47,93,85,0.85); color: white; border: none; border-radius: 14px;
    font-size: 1.4rem; display: flex; align-items: center; justify-content: center;
  }
  #controls button:active { background: #1e433c; }
  .c-up { grid-column: 2; grid-row: 1; }
  .c-left { grid-column: 1; grid-row: 2; }
  .c-right { grid-column: 3; grid-row: 2; }
  .c-down { grid-column: 2; grid-row: 3; }
  #hint { font-size: 0.75rem; color: #888; margin-top: 2px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <h1>🎂 Mom Snake 🎂</h1>
  <div id="subtitle">Happy 60th! Gobble up the family.</div>
  <div id="scoreboard">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div id="canvasWrap">
    <canvas id="game" width="360" height="360"></canvas>
    <div id="eatenWord"></div>
    <div id="overlay">
      <h2>🐍 Mom Snake 🐍</h2>
      <p>Swipe or use the arrows to steer. Eat the names before you run into yourself!</p>
      <button class="primary" id="startBtn">Start Game</button>
    </div>
  </div>
  <div id="controls">
    <button class="c-up" data-dir="up">▲</button>
    <button class="c-left" data-dir="left">◀</button>
    <button class="c-right" data-dir="right">▶</button>
    <button class="c-down" data-dir="down">▼</button>
  </div>
  <div id="hint">Swipe on the board also works</div>
</div>

let WORDS = ["Ludwigsburg", "Ahmedabad", "Seyhan", "Hazal", "Devrim", "Toygar", "Leyla", "İdil", "Özgür", "Manila", "Ömür", "Istanbul", "Belgrad", "Duygu", "Uygar", "Hakkı", "Larissa", "Ruhi", "Engin", "Selin", "Costco", "Berkcan", "Delmie", "Abuja", "Zeynep", "Elora", "Kim", "Yunus"];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let wordBag = shuffle(WORDS);
function nextWord() {
  if (wordBag.length === 0) wordBag = shuffle(WORDS);
  return wordBag.pop();
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 18;
const CELL = canvas.width / GRID;

const faceImg = new Image();
faceImg.src = "data:image/png;base64," + FACE_B64;

let snake, dir, nextDir, food, alive, score, best = 0, loopId, currentWordText, pulse;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const eatenWordEl = document.getElementById('eatenWord');

function resetGame() {
  const mid = Math.floor(GRID / 2);
  snake = [{x: mid, y: mid}, {x: mid-1, y: mid}, {x: mid-2, y: mid}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  alive = true;
  score = 0;
  scoreEl.textContent = score;
  placeFood();
  pulse = 0;
}

function placeFood() {
  let pos;
  while (true) {
    pos = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
    if (!snake.some(s => s.x === pos.x && s.y === pos.y)) break;
  }
  currentWordText = nextWord();
  food = pos;
}

function gameOver() {
  alive = false;
  if (score > best) { best = score; bestEl.textContent = best; }
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h2>💥 Oops, Mom!</h2>
    <p>You gobbled up <b>${score}</b> family member${score===1?'':'s'} before things got tangled.</p>
    <button class="primary" id="startBtn">Play Again</button>
  `;
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function startGame() {
  resetGame();
  overlay.style.display = 'none';
  clearInterval(loopId);
  loopId = setInterval(tick, 150);
}

function tick() {
  if (!alive) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 1;
    scoreEl.textContent = score;
    eatenWordEl.textContent = "+ " + currentWordText + "!";
    eatenWordEl.style.opacity = 1;
    setTimeout(() => { eatenWordEl.style.opacity = 0; }, 500);
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // grid bg subtle
  ctx.fillStyle = '#fffaf0';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // food word
  pulse = (pulse + 1) % 20;
  const scale = 1 + 0.05*Math.sin(pulse/20*Math.PI*2);
  ctx.save();
  ctx.font = `bold ${13*scale}px -apple-system, sans-serif`;
  ctx.fillStyle = '#d6376b';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fx = food.x*CELL + CELL/2;
  const fy = food.y*CELL + CELL/2;
  // background pill
  const textW = ctx.measureText(currentWordText).width;
  const padX = 6;
  ctx.fillStyle = 'rgba(214,55,107,0.12)';
  roundRect(ctx, fx - textW/2 - padX, fy - 10, textW + padX*2, 20, 10);
  ctx.fill();
  ctx.fillStyle = '#d6376b';
  ctx.fillText(currentWordText, fx, fy+1);
  ctx.restore();

  // snake body
  for (let i = snake.length - 1; i >= 1; i--) {
    const s = snake[i];
    const t = 1 - (i / snake.length) * 0.5;
    ctx.fillStyle = `rgba(47, 93, 85, ${0.5 + t*0.5})`;
    const cx = s.x*CELL + CELL/2;
    const cy = s.y*CELL + CELL/2;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL*0.4, 0, Math.PI*2);
    ctx.fill();
  }

  // head = mom face
  const h = snake[0];
  const hx = h.x*CELL + CELL/2;
  const hy = h.y*CELL + CELL/2;
  const r = CELL*0.52;
  ctx.save();
  ctx.beginPath();
  ctx.arc(hx, hy, r, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();
  if (faceImg.complete && faceImg.naturalWidth > 0) {
    ctx.drawImage(faceImg, hx-r, hy-r, r*2, r*2);
  } else {
    ctx.fillStyle = '#e8b7c7';
    ctx.fillRect(hx-r, hy-r, r*2, r*2);
  }
  ctx.restore();
  ctx.beginPath();
  ctx.arc(hx, hy, r, 0, Math.PI*2);
  ctx.strokeStyle = '#2f5d55';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function setDir(nx, ny) {
  // prevent reversing directly into self
  if (snake.length > 1 && dir.x === -nx && dir.y === -ny) return;
  nextDir = { x: nx, y: ny };
}

document.querySelectorAll('#controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.dir;
    if (d === 'up') setDir(0,-1);
    if (d === 'down') setDir(0,1);
    if (d === 'left') setDir(-1,0);
    if (d === 'right') setDir(1,0);
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') setDir(0,-1);
  if (e.key === 'ArrowDown') setDir(0,1);
  if (e.key === 'ArrowLeft') setDir(-1,0);
  if (e.key === 'ArrowRight') setDir(1,0);
});

// swipe controls
let touchStartX = 0, touchStartY = 0;
const wrap = document.getElementById('canvasWrap');
wrap.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
}, {passive: true});
wrap.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDir(dx > 0 ? 1 : -1, 0);
  } else {
    setDir(0, dy > 0 ? 1 : -1);
  }
}, {passive: true});

document.getElementById('startBtn').addEventListener('click', startGame);

resetGame();
draw();
</script>
